[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "lexile-corpus-tuner"
version = "0.1.0"
description = "Lexile-inspired corpus tuner with CLI for analyzing and rewriting documents."
authors = ["Lexile Corpus Tuner Maintainers"]
license = "MIT"
readme = "README.md"
packages = [{ include = "lexile_corpus_tuner", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
typer = ">=0.9.0"
PyYAML = ">=6.0"
numpy = ">=1.23"
click = ">=8.1"
pandas = ">=2.0"
scikit-learn = ">=1.3"
scipy = ">=1.10"
requests = ">=2.31"
beautifulsoup4 = ">=4.12"
pyarrow = ">=15.0"
tensorflow = { version = ">=2.10.0", optional = true }
joblib = { version = ">=1.1.0", optional = true }
nltk = { version = ">=3.8", optional = true }
keras-preprocessing = { version = ">=1.1", optional = true }
openai = { version = ">=1.40.0", optional = true }

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
pytest-cov = ">=7.0"
black = ">=23.0"
ruff = "^0.1.0"
pyright = "^1.1.407"
openai = "^2.8.0"

[tool.poetry.extras]
lexile-v2 = ["tensorflow", "joblib", "nltk", "keras-preprocessing"]
llm-openai = ["openai"]

[tool.poetry.scripts]
lexile-tuner = "lexile_corpus_tuner.cli:main"
text-difficulty-pipeline = "lexile_corpus_tuner.cli:text_difficulty_cli"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"
fix = true
show-fixes = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "S",    # flake8-bandit (security)
    "TID",  # flake8-tidy-imports
    "TCH",  # flake8-type-checking
]
per-file-ignores = { "tests/**/*" = ["S101"], "src/lexile_corpus_tuner/cli.py" = ["B008"] }

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra"
testpaths = ["tests"]

[tool.pyright]
typeCheckingMode = "strict"
diagnosticMode = "workspace"
reportMissingTypeArgument = "none"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
exclude = [
  "**/__pycache__",
  ".idea",
  ".ruff_cache",
  ".venv",
  "build",
  "dist"
]
